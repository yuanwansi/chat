<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮汐信笺</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23276e72'/%3E%3Cpath d='M6 21c3-4 6-4 9 0s6 4 9 0' stroke='%23f6f5f0' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6 14c3-4 6-4 9 0s6 4 9 0' stroke='%23bddbd0' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-page" class="page">
    <div class="login-box">
      <h1>潮汐信笺</h1>
      <p class="lede">用用户名或邮箱登录，与好友实时畅聊。</p>
      <form id="login-form">
        <input type="text" id="email" placeholder="用户名或邮箱" required autocomplete="off">
        <input type="password" id="password" placeholder="密码" required>
        <button type="submit">登录</button>
      </form>
      <p class="switch">
        没有账号？<a href="#" id="show-register">注册</a>
        <br><a href="#" id="show-reset">忘记密码？</a>
      </p>
    </div>
  </div>

  <!-- 注册页 -->
  <div id="register-page" class="page" style="display:none">
    <div class="login-box">
      <h1>注册账号</h1>
      <p class="lede">设置用户名与邮箱，邮箱用于找回密码，也可用于登录。</p>
      <form id="register-form">
        <input type="text" id="reg-username" placeholder="用户名" required autocomplete="off">
        <input type="email" id="reg-email" placeholder="邮箱地址（用于找回密码）" required>
        <input type="password" id="reg-password" placeholder="密码（至少6位）" required>
        <input type="password" id="reg-password2" placeholder="请再次输入密码" required>
        <button type="submit">注册</button>
      </form>
      <p class="switch">
        已有账号？<a href="#" id="show-login">登录</a>
      </p>
    </div>
  </div>

  <!-- 聊天主页 -->
  <div id="chat-page" class="page" style="display:none">
    <div class="chat-container">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">↗</span>
          <span class="brand-name">潮汐信笺</span>
        </div>
        <p class="eyebrow">TIDE LETTER / 等你上线</p>
        <div class="user-info">
          <span id="current-user"></span>
          <button id="profile-btn">个人信息</button>
        </div>
        <div class="search-box">
          <input type="text" id="room-search" placeholder="搜索岛屿名称..." autocomplete="off">
          <label class="filter-lock"><input type="checkbox" id="only-locked"> 只看加密</label>
        </div>
        <div class="room-list" id="room-list"></div>
        <button id="create-room-btn">+ 创建岛屿</button>
      </aside>

      <main class="chat-main">
        <div class="chat-header" id="chat-header">
          <button id="back-btn">← 返回</button>
          <span>选择一个岛屿</span>
          <button id="video-call-btn" style="display:none">📹 视频通话</button>
          <button id="manage-room-btn" style="display:none">⚙ 管理房间</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typing-indicator"></div>
        <form class="input-area" id="message-form">
          <input type="text" id="message-input" placeholder="输入消息..." disabled autocomplete="off">
          <input type="file" id="file-input" accept="image/*" style="display:none">
          <button type="button" id="attach-btn">📎</button>
          <button type="submit" id="send-btn" disabled>发送</button>
        </form>
      </main>
    </div>
  </div>

  <!-- 个人信息管理弹窗 -->
  <div id="profile-modal" class="modal" style="display:none">
    <div class="modal-content profile-content">
      <h2 class="modal-title">个人信息管理</h2>
      <p class="modal-sub">管理您的账号资料与安全设置</p>

      <div class="profile-section">
        <label>用户名</label>
        <div class="inline-row">
          <input type="text" id="pf-username" autocomplete="off">
          <button id="pf-save-username">保存</button>
        </div>
      </div>

      <div class="profile-section">
        <label>邮箱</label>
        <div class="inline-row">
          <input type="email" id="pf-email">
          <button id="pf-save-email">保存</button>
        </div>
      </div>

      <div class="profile-section">
        <label>修改密码</label>
        <div class="inline-row">
          <input type="password" id="pf-new-password" placeholder="新密码（至少6位）">
          <button id="pf-save-password">更新</button>
        </div>
      </div>

      <div class="profile-actions">
        <button id="pf-logout" class="quiet">退出登录</button>
        <button id="pf-delete" class="danger">注销账号</button>
        <button id="pf-close" class="close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 视频通话弹窗 -->
  <div id="video-modal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="video-grid">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
      </div>
      <div class="video-controls">
        <button id="hangup-btn">📞 挂断</button>
        <button id="toggle-mic-btn">🎤 静音</button>
        <button id="toggle-camera-btn">📷 关闭摄像头</button>
      </div>
    </div>
  </div>

  <!-- 来电邀请弹窗 -->
  <div id="call-invite-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h2 class="modal-title">📹 视频通话邀请</h2>
      <p id="call-invite-text" class="modal-sub">正在邀请对方视频通话...</p>
      <div id="call-invite-waiting" class="call-status">
        <p>⏳ 等待对方接受...</p>
      </div>
      <div id="call-invite-incoming" class="call-actions" style="display:none">
        <button id="call-accept-btn" class="call-accept">✅ 接受</button>
        <button id="call-reject-btn" class="call-reject">❌ 拒绝</button>
      </div>
    </div>
  </div>

  <!-- 站内通用弹窗 -->
  <div class="modal" id="ui-modal" style="display:none">
    <div class="modal-content ui-dialog">
      <h3 class="ui-dialog-title" id="ui-dialog-title"></h3>
      <p class="ui-dialog-text" id="ui-dialog-text"></p>
      <input type="text" id="ui-dialog-input" style="display:none" autocomplete="off">
      <div class="ui-dialog-actions">
        <button id="ui-dialog-cancel" style="display:none">取消</button>
        <button id="ui-dialog-ok">确定</button>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
